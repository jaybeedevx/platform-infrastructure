name: "Terraform Apply"

on:
  push:
    branches: [main]
    paths:
      - "environments/dev/**"
      - "environments/staging/**"
      - "environments/production/**"
      - "modules/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.6.5"
  AWS_REGION: "us-east-1"
  TF_VAR_aws_region: "us-east-1"

jobs:
  detect:
    name: "Detect changed environments"
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.set.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dev: 'environments/dev/**'
            staging: 'environments/staging/**'
            production: 'environments/production/**'
            modules: 'modules/**'
      - name: Build environment list
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'environments=["${{ inputs.environment }}"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ steps.filter.outputs.modules }}" = "true" ]; then
            echo 'environments=["dev","staging","production"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          envs="[]"
          [ "${{ steps.filter.outputs.dev }}" = "true" ] && envs=$(echo "$envs" | jq -c '. + ["dev"]')
          [ "${{ steps.filter.outputs.staging }}" = "true" ] && envs=$(echo "$envs" | jq -c '. + ["staging"]')
          [ "${{ steps.filter.outputs.production }}" = "true" ] && envs=$(echo "$envs" | jq -c '. + ["production"]')
          echo "environments=$envs" >> "$GITHUB_OUTPUT"

  plan:
    name: "Plan (${{ matrix.env }})"
    needs: detect
    if: needs.detect.outputs.environments != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.detect.outputs.environments) }}
    defaults:
      run:
        working-directory: environments/${{ matrix.env }}
    outputs:
      has_changes_${{ matrix.env }}: ${{ steps.plan.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
      - name: Validate
        run: terraform validate -no-color
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -no-color -input=false -out=plan.tfplan -detailed-exitcode
          code=$?
          set -e
          if [ "$code" = "2" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "0" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            exit 1
          fi
      - name: Upload plan artifact
        if: steps.plan.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: environments/${{ matrix.env }}/plan.tfplan
          retention-days: 5

  apply:
    name: "Apply (${{ matrix.env }})"
    needs: [detect, plan]
    if: needs.plan.outputs['has_changes_${{ matrix.env }}'] == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.detect.outputs.environments) }}
    environment:
      name: ${{ matrix.env }}   # uses GitHub Environment: dev, staging, production
    defaults:
      run:
        working-directory: environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}
          path: environments/${{ matrix.env }}
      - name: Apply
        run: terraform apply -input=false -auto-approve plan.tfplan
      - name: Summarize
        if: always()
        run: |
          {
            echo "### Terraform Apply — ${{ matrix.env }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Triggered by: ${{ github.actor }}"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"