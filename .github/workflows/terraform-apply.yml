name: "Terraform Apply"

on:
  push:
    branches: [main]
    paths:
      - "environments/dev/**"
      - "environments/staging/**"
      - "environments/production/**"
      - "modules/**"
      - ".github/workflows/terraform-apply.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - production

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.6.5"
  AWS_REGION: "us-east-1"
  TF_VAR_aws_region: "us-east-1"

jobs:
  detect:
    name: "Detect changed environments"
    runs-on: ubuntu-latest
    outputs:
      environments: ${{ steps.set.outputs.environments }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            dev: 'environments/dev/**'
            staging: 'environments/staging/**'
            production: 'environments/production/**'
            modules: 'modules/**'
      - name: Build environment list
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'environments=["${{ inputs.environment }}"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${{ steps.filter.outputs.modules }}" = "true" ]; then
            echo 'environments=["dev","staging","production"]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          envs="[]"
          [ "${{ steps.filter.outputs.dev }}" = "true" ] && envs=$(echo "$envs" | jq -c '. + ["dev"]')
          [ "${{ steps.filter.outputs.staging }}" = "true" ] && envs=$(echo "$envs" | jq -c '. + ["staging"]')
          [ "${{ steps.filter.outputs.production }}" = "true" ] && envs=$(echo "$envs" | jq -c '. + ["production"]')
          echo "environments=$envs" >> "$GITHUB_OUTPUT"

  # Plan and apply run in a single job per environment. This workflow fires
  # only on push to main (or manual dispatch), gated by GitHub Environment
  # protection rules, so the plan can be applied immediately and no artifact
  # handoff between jobs is needed -- avoiding the fragile has_changes-output
  # and artifact-download steps that previously silently skipped every apply.
  deploy:
    name: "Deploy (${{ matrix.env }})"
    needs: detect
    if: needs.detect.outputs.environments != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: ${{ fromJSON(needs.detect.outputs.environments) }}
    concurrency:
      group: terraform-apply-${{ matrix.env }}
      cancel-in-progress: false
    environment:
      name: ${{ matrix.env }}
    defaults:
      run:
        working-directory: environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      # Runs under `environment: ${{ matrix.env }}` above, so this variable
      # resolves to the per-environment deployer role (env-scoped variable).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
      - name: Plan
        run: terraform plan -no-color -input=false -out=plan.tfplan
      - name: Apply
        run: terraform apply -no-color -input=false -auto-approve plan.tfplan
      - name: Summarize
        if: always()
        run: |
          {
            echo "### Terraform Apply — ${{ matrix.env }}"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Triggered by: ${{ github.actor }}"
            echo "- Status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
