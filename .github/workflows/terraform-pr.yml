name: "Terraform PR Check"

on:
  pull_request:
    paths:
      - "environments/dev/**"
      - "environments/staging/**"
      - "environments/prod/**"
      - "modules/**"
      - ".github/workflows/terraform-pr.yml"

concurrency:
  group: terraform-pr-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.6.5"
  AWS_REGION: "us-east-1"
  TF_VAR_aws_region: "us-east-1"

jobs:
  lint:
    name: "Lint & Validate"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]
    defaults:
      run:
        working-directory: environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Format
        run: terraform fmt -check -recursive
      - name: Init (no backend)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  security:
    name: "Security Scan (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "environments/"
          severity: "HIGH,CRITICAL"
          exit-code: "1"

  plan:
    name: "Plan (${{ matrix.env }})"
    needs: [lint, security]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [dev, staging, prod]
    defaults:
      run:
        working-directory: environments/${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}"
      - name: Plan
        id: plan
        continue-on-error: true
        run: |
          terraform plan -no-color -input=false -out=plan.tfplan | tee plan_output.txt
      - name: Post plan comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // This script will post/update a comment with the plan output.
            // To handle multiple environments, we append the environment name.
            const fs = require('fs');
            const envName = '${{ matrix.env }}';
            const outputFile = `environments/${envName}/plan_output.txt`;
            let output;
            try {
              output = fs.readFileSync(outputFile, 'utf8');
            } catch (e) {
              output = `Plan for ${envName} could not be generated.`;
            }
            const truncated = output.length > 60000 ? output.substring(0,60000) + '\n\n... (truncated)' : output;
            const marker = `<!-- terraform-pr-plan-${envName} -->`;
            const body = `${marker}\n### Terraform Plan — ${envName}\n\n<details><summary>Show Plan</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n</details>\n\n<sub>Commit: \`${{ github.sha }}\`</sub>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Fail if plan failed
        if: steps.plan.outcome != 'success'
        run: exit 1