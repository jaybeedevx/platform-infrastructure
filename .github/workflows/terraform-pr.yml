name: "Terraform PR Check"

on:
  pull_request:
    paths:
      - 'environments/dev/**'
      - 'modules/**'
      - '.github/workflows/terraform-pr.yml'

env:
  TF_VERSION: "1.6.5"
  AWS_REGION: "us-east-1"                     
  TF_WORKING_DIR: environments/dev
  TF_VAR_aws_region: "us-east-1"              
  # Avoid storing AWS keys; use GitHub OIDC (see below)

permissions:
  id-token: write        # required for OIDC
  contents: read
  pull-requests: write   # to post plan comment

jobs:
  terraform-checks:
    name: "Terraform Lint, Validate, Security Scan & Plan"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        run: terraform init -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" -backend-config="region=${{ env.AWS_REGION }}"

      - name: Terraform Validate
        run: terraform validate

      - name: Run TFSec (Security Scan)
        uses: aquasecurity/tfsec-pr-commenter-action@v1.3.1
        with:
          tfsec_args: --concise-output
          working_directory: ${{ env.TF_WORKING_DIR }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -no-color -out=plan.tfplan
          echo "PLAN_OUTPUT<<EOF" >> $GITHUB_ENV
          terraform show -no-color plan.tfplan >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Post Plan to PR
        uses: actions/github-script@v9
        if: github.event_name == 'pull_request'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = process.env.PLAN_OUTPUT;
            const comment = `### Terraform Plan :clipboard:\n\n<details><summary>Show Plan</summary>\n\n\`\`\`\n${output}\n\`\`\`\n</details>`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(comment => comment.user.type === 'Bot' && comment.body.includes('Terraform Plan'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
